<!DOCTYPE html>
<html>
<head>
    <title>To_Do List</title>
</head>
<body>

    <h1>Ma To_Do List</h1>

    <input type="text" id="task" placeholder="Nouvelle tâche">
    <button onclick="addTask()">Ajouter</button>

    <ul id="list"></ul>

<script>
function addTask() {
    let task = document.getElementById("task").value;
    let li = document.createElement("li");
    li.textContent = task;
    li.onclick = function() { li.remove(); };
    document.getElementById("list").appendChild(li);
}
</script>

</body>
</html>
